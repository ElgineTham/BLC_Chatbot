[project]
name = "blc-chatbot"
version = "0.1.0"
description = "Bay Laurel Catering internal chatbot"
authors = [
    {name = "Bay Laurel Catering"}
]
requires-python = "^3.10"
dependencies = [
    "langchain (>=1.4.7,<2.0.0)",
    "langgraph (>=1.2,<2.0)",
    "langchain-google-genai (>=4.0.0,<5.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "fastapi (>=0.115,<0.120)",
    "uvicorn (>=0.54,<1.0)",
    "httpx (>=0.27,<0.29)",
    "langchain-anthropic (>=1.0.0,<2.0.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.eval.dependencies]
ollama = ">=0.6.3,<0.7.0"
langchain-ollama = ">=1.1.0,<2.0.0"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/scripts", "backend/src"]
addopts = "--import-mode=importlib"
markers = [
    "integration: uses real Gemini/Chroma/Ollama; skipped if the service is unavailable",
    "eval: golden-set quality metrics judged against thresholds",
]
# Host environments (e.g. ROS) may inject broken pytest plugins via entry points.
# Prefer: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 poetry run pytest

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
