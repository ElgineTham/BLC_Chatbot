[project]
name = "blc-chatbot"
version = "0.1.0"
description = "Bay Laurel Catering internal chatbot"
authors = [
    {name = "Bay Laurel Catering"}
]
requires-python = "^3.10"
dependencies = [
    "ollama (>=0.6.3,<0.7.0)",
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "pypdf (>=6.21.4,<7.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "numpy (>=1.26,<3.0)",
    "faster-whisper (>=1.1,<2.0)",
    "piper-tts (>=1.3,<2.0)",
    "sounddevice (>=0.5,<0.6)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "integration: uses real Ollama/Chroma; skipped if Ollama is unavailable",
    "eval: golden-set quality metrics judged against thresholds",
]
# Host environments (e.g. ROS) may inject broken pytest plugins via entry points.
# Prefer: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 poetry run pytest

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
