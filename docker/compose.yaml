name: blc-chatbot

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: blc-chatbot:latest
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ../data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ../.chroma
        target: /app/.chroma
        bind:
          create_host_path: false
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
