name: blc-chatbot

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: blc-chatbot:latest
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ../data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ../.chroma
        target: /app/.chroma
        bind:
          create_host_path: false
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
