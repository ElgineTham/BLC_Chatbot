name: ingest

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry and dependencies (no voice group)
        run: |
          pip install poetry
          poetry install --without voice

      - name: Install Ollama and pull the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:11434/ > /dev/null && break
            sleep 2
          done
          ollama pull nomic-embed-text

      - name: Ingest
        run: poetry run python backend/scripts/ingest.py

      - name: Commit updated .chroma/
        run: |
          git add .chroma
          if git diff --cached --quiet; then
            echo "No .chroma/ changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update .chroma/ after data change [skip ci]"
          git push
