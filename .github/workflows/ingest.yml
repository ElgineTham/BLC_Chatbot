name: ingest

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.md"
      - "backend/src/blc/llm/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry and dependencies (without the eval group)
        run: |
          pip install poetry
          poetry install --without eval

      - name: Ingest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: poetry run python backend/scripts/ingest.py

      - name: Commit updated .chroma/
        run: |
          git add .chroma
          if git diff --cached --quiet; then
            echo "No .chroma/ changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update .chroma/ after data change [skip ci]"
          git push
